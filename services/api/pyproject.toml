[project]
name = "mcpharbour"
version = "0.1.0"
description = "MCP Harbor backend — desktop MCP management platform"
requires-python = ">=3.13,<3.16"
license = { text = "MIT" }
authors = [{ name = "Pedro Moraes" }]



dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "docker>=7.1",
    "keyring>=25.5",
    "httpx>=0.28",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "mcp>=1.28.0",
    "mcp-proxy>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "aiosqlite>=0.20",
]
build = [
    "pyinstaller>=6.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "presentation", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
source = ["domain", "application", "infrastructure", "presentation", "shared"]
omit = ["*/tests/*", "*/alembic/*"]
